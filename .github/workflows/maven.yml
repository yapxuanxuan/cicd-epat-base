name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Unit Testing with Maven
      run: mvn test

  snyk-security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/maven@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects

  telegram-notification:
    needs: snyk-security-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Send Telegram notification
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        STATUS="${{ needs.snyk-security-scan.result }}"
        BRANCH="${{ github.ref_name }}"
        COMMIT="${{ github.sha }}"
        URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        if [ "$STATUS" = "success" ]; then
          EMOJI="✅"
          MESSAGE="Snyk scan passed on *${BRANCH}* (${COMMIT:0:7})"
        else
          EMOJI="❌"
          MESSAGE="Snyk scan failed on *${BRANCH}* (${COMMIT:0:7})"
        fi

        BODY=$(printf '%s\n\n%s\n🔗 <a href="%s">View Run</a>' "${EMOJI} **GitHub Actions - Snyk Scan**" "${MESSAGE}" "${URL}")
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TELEGRAM_CHAT_ID}" \
                  -d "text=${BODY}" \
                  -d "parse_mode=HTML"
